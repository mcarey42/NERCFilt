name: Build and test

# Pushes to main and pull requests: build and test x64 and ARM64.
#
# Releases: push a tag matching NERCFilt/version.h (for example v2.0.0).
# Each architecture is built natively and tested. Build-provenance
# attestations are generated, and a DRAFT release is created with the zips
# and SHA256SUMS.txt attached. A maintainer reviews the draft and publishes
# it; nothing is public until then. See docs/RELEASING.md.
#
# Every third-party action is pinned to a full commit SHA (the comment gives
# the version); Dependabot keeps the pins current.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }} on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022   # Windows Server 2022
            platform: x64
            publish: true
          - runner: windows-2025   # Windows Server 2025 (test only)
            platform: x64
            publish: false
          - runner: windows-11-arm # native ARM64 build and test
            platform: ARM64
            publish: true
    runs-on: ${{ matrix.runner }}
    env:
      OUT: ${{ github.workspace }}\build\${{ matrix.platform }}\Release
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $h = Get-Content NERCFilt\version.h -Raw
          $v = '{0}.{1}.{2}' -f ([regex]::Match($h, 'VERSION_MAJOR (\d+)').Groups[1].Value),
                                ([regex]::Match($h, 'VERSION_MINOR (\d+)').Groups[1].Value),
                                ([regex]::Match($h, 'VERSION_PATCH (\d+)').Groups[1].Value)
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "NERCFilt $v"

      - name: Check tag matches version.h
        if: env.IS_RELEASE == 'true'
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ($env:TAG -ne "v$env:VERSION") {
            Write-Error "Tag '$env:TAG' does not match version.h (expected 'v$env:VERSION')."
            exit 1
          }

      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Build
        run: msbuild NERCFilt.sln /m /nologo /v:minimal /p:Configuration=Release /p:Platform=${{ matrix.platform }}

      - name: Test (password policy)
        run: '& "$env:OUT\NERCFiltTests.exe"'

      - name: Test (registration and policy configuration; modifies HKLM on this runner)
        if: ${{ !cancelled() }}
        run: '& "$env:OUT\NERCFiltTests.exe" --registry'

      - name: Lint install script
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck
          }
          $issues = Invoke-ScriptAnalyzer -Path scripts\Install-NERCFilt.ps1 -Severity Warning, Error
          $issues | Format-Table -AutoSize | Out-String | Write-Host
          if ($issues) { exit 1 }

      - name: Test install script (installs, reports and uninstalls on this runner)
        if: ${{ !cancelled() }}
        # Windows PowerShell 5.1, as shipped with Windows Server 2016.
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $script = "$env:GITHUB_WORKSPACE\scripts\Install-NERCFilt.ps1"
          # -Force: some runner images enable LSA Protection, which the
          # script otherwise (correctly) refuses to install under.
          & $script -Path "$env:OUT\NERCFilt.dll" -Force -NoRestartPrompt
          & $script -Status
          $pkgs = (Get-ItemProperty HKLM:\SYSTEM\CurrentControlSet\Control\Lsa).'Notification Packages'
          if ($pkgs -notcontains 'NERCFilt') { throw 'NERCFilt was not registered' }
          & $script -Uninstall -NoRestartPrompt
          $pkgs = (Get-ItemProperty HKLM:\SYSTEM\CurrentControlSet\Control\Lsa).'Notification Packages'
          if ($pkgs -contains 'NERCFilt') { throw 'NERCFilt was not unregistered' }

      - name: Package
        if: env.IS_RELEASE == 'true' && matrix.publish
        shell: pwsh
        env:
          NAME: NERCFilt-${{ steps.version.outputs.version }}-${{ matrix.platform }}
        run: |
          New-Item -ItemType Directory -Path "dist\$env:NAME" | Out-Null
          Copy-Item "$env:OUT\NERCFilt.dll", "$env:OUT\NERCFilt.pdb", scripts\Install-NERCFilt.ps1, README.md, LICENSE `
            -Destination "dist\$env:NAME"
          # bsdtar writes portable zip entry names (forward slashes).
          tar -a -c -f "dist\$env:NAME.zip" -C dist $env:NAME
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload package
        if: env.IS_RELEASE == 'true' && matrix.publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NERCFilt-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the draft release
      id-token: write      # sign build-provenance attestations (Sigstore)
      attestations: write  # store them on GitHub
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Extract DLLs and compute checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum *.zip > SHA256SUMS.txt
          for z in *.zip; do
            d="${z%.zip}"
            unzip -q "$z" "$d/NERCFilt.dll" -d extracted
            (cd extracted && sha256sum "$d/NERCFilt.dll") >> SHA256SUMS.txt
          done
          cat SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/extracted/*/NERCFilt.dll

      - name: Create draft release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft > state 2>/dev/null; then
            if [ "$(cat state)" != "true" ]; then
              echo "::error::Release $TAG is already published; published releases are not modified."
              exit 1
            fi
            gh release upload "$TAG" *.zip SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" *.zip SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "NERCFilt ${TAG#v}" --generate-notes
          fi
          echo "Draft release $TAG is ready for review: publish it from the Releases page."
