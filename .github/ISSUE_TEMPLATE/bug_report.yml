name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problem (an LSASS crash, a password accepted that should be
        rejected, or similar)? Please **don't** file it here: use
        [private vulnerability reporting](https://github.com/mcarey42/NERCFilt/security/advisories/new).
  - type: input
    id: version
    attributes:
      label: NERCFilt version
      description: '`Install-NERCFilt.ps1 -Status` shows it.'
      placeholder: 2.0.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and architecture
      placeholder: Windows Server 2022 x64, domain controller
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: status
    attributes:
      label: Output of `Install-NERCFilt.ps1 -Status`
      render: text
